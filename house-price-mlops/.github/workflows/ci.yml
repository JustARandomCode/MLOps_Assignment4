name: CI

on:
  pull_request:
    branches: [main, dev]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint (flake8)
        run: flake8 src api tests dags

      - name: Build model for tests (deterministic data + dvc repro)
        run: |
          python src/generate_data.py
          dvc repro

      - name: Run tests
        run: pytest -v tests
